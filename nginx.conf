server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  # Preserve the server-wide security headers in locations that add cache headers.
  add_header_inherit merge;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # DENY is the safe default. If terminimator sketches should be embeddable in
  # other pages, this is the line to relax — deliberately, not by accident.
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # Conservative first HSTS rollout, mirroring groundcoverworks.com. Increase only
  # after observing production; do not add includeSubDomains or preload without a
  # domain-wide audit — this subdomain shares an apex with the rest of ufffd.com.
  add_header Strict-Transport-Security "max-age=86400" always;

  location = /health.json {
    access_log off;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Vite emits content-hashed filenames into /assets/, so they are immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-route SPA: all sketch state rides in the ?s= query parameter, which the
  # server never sees. Any path falls back to the app rather than 404ing, so an
  # edited or truncated URL still lands somewhere usable.
  location / {
    try_files $uri /index.html;
  }
}
